; TORQUE_CONSTANT K_t,i [N m/A], CURRENT_RATIO kappa_i [1/A],
; HOME_POSITION_OFFSET c_0,i [counts] (the encoder count at q_i = 0, of this
; robot), TORQUE_LIMIT_U tau_max [N m] (Table 7)
