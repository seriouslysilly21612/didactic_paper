;==========================================================================
; The configuration of the controller of the Indy7 (src/base/Config.h).
; "[SECTION]" and "KEY=VALUE" lines; ';' or '#' starts a comment. A relative
; path is relative to the directory of this file. The values are those of
; the experiments of the paper; the constants of [AXIS0]..[AXIS5] (encoder
; offsets, directions) belong to the robot of the experiments.
;==========================================================================
[SYSTEM]
NAME=INDY7
; 1: the simulation (MuJoCo in place of the bus); -s on the command line does
; the same, -b the bus of the robot (drives off) beside the simulated arm
SIMULATION_MODE=0
; the model of the controller (paper, Table 1: indy-ros2, variant indy7)
URDF_PATH=models/indy7.urdf
ROBOT_DOF=6

;--------------------------------------------------------------------------
; the joint-space controller (paper, Sec. IV-A, Table 7)
;--------------------------------------------------------------------------
; the gains of eq. (5): Kp = omega_n^2, Kd = 2 zeta omega_n
KP_0=800.0
KD_0=80.0
KP_1=600.0
KD_1=60.0
KP_2=400.0
KD_2=40.0
KP_3=200.0
KD_3=28.0
KP_4=150.0
KD_4=25.0
KP_5=100.0
KD_5=20.0
; the friction feedforward K_f [N m] of eq. (7), 0: off. Used in TRACK and
; HOME (on the robot, or in the simulation with SIM_FRICTION_ON=1) and in
; JOINT TEST 4.
KF_0=5.965
KF_1=5.361
KF_2=2.929
KF_3=3.625
KF_4=2.018
KF_5=4.418
; FRICTION_FF_GATE=0: the feedforward without the gate gamma of eq. (7) (the
; ablation of JOINT TEST 4)
FRICTION_FF_GATE=1
; the rotor inertias B_ii [kg m^2] of eq. (4), reflected through the gears,
; identified with JOINT TEST 7 (tools/identify_rotor.py); the controller
; bounds them at 2.0. 0: none - J6 then cannot follow a reference, and the
; JOINT TEST refuses a motion of J6.
ROTOR_INERTIA_0=6.07917
ROTOR_INERTIA_1=6.68933
ROTOR_INERTIA_2=1.99649
ROTOR_INERTIA_3=0.87306
ROTOR_INERTIA_4=0.86394
ROTOR_INERTIA_5=0.84747
; the operator switches the controller on ('r'); it starts in gravity
; compensation
ENABLE_CONTROLLER_AT_STARTUP=0
; servo on ('h') and the E-stop of the control box. 'h' is refused while a
; drive stays in Switch on disabled (or Not ready to switch on) although
; Shutdown is written in every period: the E-stop is pressed, or the drive
; is inhibited. A servo on that has not brought every joint to Operation
; enabled after SERVO_ON_TIMEOUT_MS [ms] is withdrawn (every joint off), so
; that it cannot wait for the E-stop to be released and enable the drives
; then. Every 'h' prints how long it took; keep the timeout well above that.
SERVO_ON_TIMEOUT_MS=2000

;--------------------------------------------------------------------------
; the simulation (-s, -b; src/sim/SimArm.h)
;--------------------------------------------------------------------------
SIM_MJCF_PATH=models/indy7_mujoco.xml
; the state reaches the controller 2 steps old, and a torque acts 2 steps
; after that state; the pipeline adds its period (send before compute)
SIM_STATE_DELAY_STEPS=2
SIM_TORQUE_DELAY_STEPS=2
; dry friction (frictionloss) at the breakaway torques tau_s [N m] of J1-J6
; (Table 7)
SIM_FRICTION_ON=0
SIM_TAU_S=11.930 10.721 5.859 3.625 2.036 8.835
; SIM_ARMATURE=b1 ... b6 [kg m^2]: rotor inertias of the simulated arm of
; their own (default: ROTOR_INERTIA_n), e.g. to check that the sine test and
; tools/identify_rotor.py recover a known B
; the initial posture [rad], brakes engaged
SIM_INITIAL_Q=0 0 -1.5707963267948966 0 -1.5707963267948966 0
; Fault injection, SIMULATION ONLY (-s; refused on the robot and with -b),
; armed by SIM_FAULT_JOINT (1-based, 0: off) and triggered by 'n':
;   SIM_FAULT_WHAT=torque  the torque of the joint after the law is not
;                          finite, in the next cycle (SIM_FAULT_PERSIST=0) or
;                          in every cycle until 'r' switches the controller
;                          off (1); the fault latches: zero torque, the motion
;                          ends, the drives go off; 'r', 'r', 'h' go on
;   SIM_FAULT_WHAT=state   the same with the measured angle before the law
;   SIM_FAULT_WHAT=dropout with the servo on, the joint leaves Operation
;                          enabled once, as the E-stop of the control box
;                          does: every joint goes off, the motion ends
;   SIM_FAULT_WHAT=estop   'n' cuts the power of every drive, the next 'n'
;                          restores it; SIM_ESTOP_REPORTS: what a drive
;                          reports meanwhile, sod (Switch on disabled), ready
;                          (Ready to switch on) or fault (Fault)
SIM_FAULT_JOINT=0
SIM_FAULT_WHAT=torque
SIM_FAULT_PERSIST=0
SIM_ESTOP_REPORTS=sod
; the live view: joint angles over TCP for tools/sim_view.py (0: off)
VIEW_PORT=7430
VIEW_RATE_HZ=50

;--------------------------------------------------------------------------
; JOINT TEST ('u', then 1-7; paper, Sec. IV-A and V-A)
;--------------------------------------------------------------------------
; 1-4: a quintic from the posture at rest q0 to q1 = q0 + dq in T, a dwell,
; back to q0 in T, a dwell; then gravity compensation. dq [rad] per joint
; (the sign sets the direction), T [s]. Refused if q0 or q1 lies within 0.1
; rad of a joint limit, or if the quintic would exceed 0.6 rad/s or 2 rad/s^2
; (peaks 1.875 dq/T and 5.774 dq/T^2). On the robot, first check that the arm
; can sweep from q0 to q1 without touching anything.
JOINT_TEST_FAST_DQ=0.3 0.3 0.3 0 0 0
JOINT_TEST_FAST_T=1.0
JOINT_TEST_SLOW_DQ=0.9 0.6 0.9 0.9 0.9 0.9
JOINT_TEST_SLOW_T=3.0
JOINT_TEST_DWELL=1.0
; 5, the torque-step delay test: in gravity compensation (hold off), tau =
; g(q) plus a step of TORQUE_STEP_NM on joint TORQUE_STEP_JOINT (1-based), on
; for TORQUE_STEP_ON_S, off for TORQUE_STEP_OFF_S, TORQUE_STEP_REPEAT times
; with alternating sign; no feedback acts. The step must stay below the
; breakaway torque of the joint (refused above 3 N m or a quarter of its
; torque limit). tools/jt_step_delay.py gives the cycles until 0x6077
; follows the step.
TORQUE_STEP_JOINT=4
TORQUE_STEP_NM=1.0
TORQUE_STEP_ON_S=0.2
TORQUE_STEP_OFF_S=0.3
TORQUE_STEP_REPEAT=20
; 6, the breakaway test (tau_s of Table 7, and the sign of the torque): in
; gravity compensation (hold off), tau = g(q) plus a ramp of
; BREAKAWAY_RATE_NMS on joint BREAKAWAY_JOINT (1-based) until it moves (|qd| >
; BREAKAWAY_QD or 5 mrad) or the ramp reaches BREAKAWAY_MAX_NM (at most 0.8
; of its torque limit); then the torque is removed and the joint damped to
; rest; BREAKAWAY_REPEAT ramps in each direction, alternating. The test ends
; if the joint leaves its start by 0.1 rad. tools/jt_breakaway.py gives tau_s
; (mean, sd) per direction and checks the sign of the motion.
BREAKAWAY_JOINT=4
BREAKAWAY_RATE_NMS=2.0
BREAKAWAY_MAX_NM=15.0
BREAKAWAY_QD=0.02
BREAKAWAY_REPEAT=5
; 7, the sine test for the rotor inertia of one joint (eq. (6)): joint
; SINE_TEST_JOINT (1-based) follows q0 + A sin(2 pi f t), faded in and out
; over two periods, SINE_TEST_PERIODS periods in all, while the other joints
; are held. With SINE_TEST_SWEEP_RADS = v0 > 0, the sine rides on a sweep at
; +-v0 out and back (up over two periods, cruise, reversal over four, cruise,
; down over two), so that the joint keeps sliding; keep A 2 pi f below v0.
; The start prints the reach (v0 (Tf/2 + Tc + 2 Tf/pi) + A); refused within
; 0.1 rad of a joint limit or above 1 rad/s or 12 rad/s^2.
; tools/identify_rotor.py fits B_ii (ROTOR_INERTIA_<i> above); tools/sine_cfg.py
; sets the values used for each joint. J6 cannot follow without its B: give it
; the value of J5 first, then run its own sine test.
SINE_TEST_JOINT=4
SINE_TEST_AMP_RAD=0.006
SINE_TEST_FREQ_HZ=4.0
SINE_TEST_PERIODS=32
SINE_TEST_SWEEP_RADS=0.2
; 1: CTC with the friction feedforward (robot); 0: CTC (simulation without friction)
SINE_TEST_FF=1
; one CSV and one .json per test; the logs of the high-level tests go here too
JOINT_TEST_LOG_DIR=jt_logs

;--------------------------------------------------------------------------
; the high-level controller (paper, Sec. IV-C, eq. (9), Table 9)
;--------------------------------------------------------------------------
; goal threshold delta [mm]; IK damping lambda [m], step bound [rad],
; tolerance [mm], iterations per cycle and per goal; limits of the generator
; [rad/s, rad/s^2, rad/s^3]; margin to the joint limits and lead bound ell
; [rad]. The margin exceeds 0.253 rad, the largest modeled overshoot of a
; replanned target of the generator with these limits. delta exceeds the
; stationary scatter of the goals from the camera (Sec. V-C).
HL_GOAL_DELTA_MM=6.0
HL_IK_LAMBDA=0.01
HL_IK_STEP_MAX=0.2
HL_IK_TOL_MM=0.1
HL_IK_ITER_CYCLE=10
HL_IK_ITER_GOAL=100
HL_VEL_MAX=0.6
HL_ACC_MAX=2.0
HL_JERK_MAX=10.0
HL_LIMIT_MARGIN=0.26
HL_LEAD_MAX=0.10
; the ready posture q_r [rad]: every accepted goal restarts the IK from it,
; and HOME goes to it. On the robot, record it with the arm ('y', then 7) and
; copy the printed values here.
HL_READY_Q=0 0 -1.5707963267948966 0 -1.5707963267948966 0

;--------------------------------------------------------------------------
; the high-level tests ('y', then 1-8; paper, Sec. V-B), all from q_r
;--------------------------------------------------------------------------
; the fixed goal relative to the tool at q_r [m] (0.3 m forward and down,
; test 1 with HL_RAND_GOALS=0), the jump of the goal [m] when the tool is
; HL_TEST_TRIGGER_M from it (test 2 with HL_RAND_JUMPS=0), the goal noise per
; axis [mm] at the rate of the camera [Hz] for HL_TEST_NOISE_S [s] (tests 3,
; 4), the length of the reference-check stream [s] (test 5)
HL_TEST_GOAL=0.2121320343559643 0 -0.2121320343559643
HL_TEST_JUMP=0 0.15 0
HL_TEST_TRIGGER_M=0.15
HL_TEST_NOISE_MM=1.0
HL_TEST_NOISE_HZ=15
HL_TEST_NOISE_S=10
HL_TEST_REF_S=60
; tests 3 and 4 with a recorded goal noise instead of the synthetic one: CSV
; t,dx,dy,dz [s, m] from tools/goal_noise_file.py (a recording of the goals
; from the camera of an object at rest); empty: synthetic
HL_TEST_NOISE_FILE=
; test 1 with random goals: their number (0: the fixed goal HL_TEST_GOAL
; instead), the seed (the same goals in the simulation and on the robot),
; the box x0 x1 y0 y1 z0 z1 in the base frame [m], and the largest distance
; from the vertical axis of the base [m]. Goals are kept only if the IK
; converges from q_r; 'y', 1 runs them all, each from q_r, 'x' stops and
; 'y', 1 continues. On the robot, set the box for the table first, and look
; at the goals in the simulation with the same cfg. Up to 1000 goals; with
; the same seed, the first ones of a longer list are the same.
HL_RAND_GOALS=10
HL_RAND_SEED=1
HL_RAND_BOX_M=0.30 0.94 -0.37 0.63 0.25 0.50
HL_RAND_RMAX_M=0.92
; test 2 with random goal jumps: their number (0: the goal of test 1 with
; the fixed jump HL_TEST_JUMP instead), the range of the jump [m], and the
; range of the fraction of the starting distance to the first goal at which
; the goal jumps. The first goal is drawn like those of test 1 (same seed,
; box, and radius, at least 0.2 m from the tool at q_r), the new goal in a
; random direction, both solved from q_r; 'y', 2 runs them all, each from
; q_r, 'x' stops and 'y', 2 continues.
HL_RAND_JUMPS=10
HL_RAND_JUMP_LEN_M=0.10 0.30
HL_RAND_JUMP_AT=0.2 0.8
; HL_STEP_BASELINE=1, SIMULATION ONLY (-s): the IK solution becomes the
; reference as a step, without the generator (Step 3) and the lead bound
; (Step 4), for comparison; refused on the robot and with -b
HL_STEP_BASELINE=0

;--------------------------------------------------------------------------
; the camera application ('p', or 'y' then 8; paper, Sec. V-C)
;--------------------------------------------------------------------------
; APP_BRIDGE=1 starts the ROS 2 bridge in the control process (a build with
; ROS 2: source /opt/ros/jazzy/setup.bash and ros2/install/setup.bash before
; run.sh, otherwise the bridge does not start and the controller runs
; without it). The bridge rejects a sample whose goal, the object plus the
; hover height, lies below the goal floor [m], outside the box x0 x1 y0 y1 z0
; z1 [m], or beyond the radius [m] from the vertical axis of the base; it
; smooths the others by an exponential moving average with the weight kappa
; of the newest sample, restarted after a gap [s], and reports a lost target
; after APP_LOSS_S [s] without an accepted sample. The high-level controller
; adds the hover height [m] to every position of the bridge. APP_DURATION_S:
; the length of a run [s], 0: until 'x'. Set the box and the floor for the
; table and the camera.
APP_BRIDGE=1
APP_GOAL_BOX_M=0.30 0.94 -0.37 0.63 0.199 0.539
APP_GOAL_RMAX_M=0.92
APP_GOAL_FLOOR_M=0.199
APP_HOVER_M=0.15
APP_EMA_KAPPA=0.4
APP_GAP_S=1.0
APP_LOSS_S=1.0
APP_DURATION_S=0
; the hand-eye capture ('w' arms it, then 's'): robot_poses.csv and
; pose_rPe_<N>.yaml go here, next to the images of calib/calib_grab.py
CALIB_DIR=../calib/data

;==========================================================================
; the real-time tasks (paper, Sec. III-A, Table 3): one release grid,
; absolute-time releases, in the order of their priorities within a period
; (src/TaskSlots.h)
;   TASK0 EtherCAT    receive -> State slot; Torque slot of the last
;                     period -> send
;   TASK1 Trajectory  goal slot -> high-level controller -> Reference slot
;   TASK2 Dynamics    State + Reference slot -> control law -> Torque slot;
;                     the operator commands
;   TASK3 Keyboard    the keys and the lines of the tools (not periodic)
; TASK_PERIOD [ns] (the three periods equal CYCLE_TIME of [ECAT_MASTER]),
; START_DELAY [ns] after the common origin, PRIORITY SCHED_FIFO 1..99
; (decreasing from TASK0 to TASK2), CPU the core of the task (without it:
; the cores of the process, i.e. the non-isolated ones). The host of the
; paper (Table 1): CPU 6 isolated, its sibling CPU 7 offline (isolcpus=domain,
; managed_irq,6-7 nohz_full=6-7 rcu_nocbs=6-7 irqaffinity=0-5,8-15).
; NAME: at most 15 characters (the name of the thread).
;==========================================================================
[RT_TASKS]
NO_OF_TASKS=4

[TASK0]
ENABLED=1
NAME=EtherCAT Task
PRIORITY=97
TASK_PERIOD=1000000
START_DELAY=0
CPU=6

[TASK1]
ENABLED=1
NAME=Trajectory Task
PRIORITY=96
TASK_PERIOD=1000000
START_DELAY=0
CPU=6

[TASK2]
ENABLED=1
NAME=Dynamics Task
PRIORITY=95
TASK_PERIOD=1000000
START_DELAY=0
CPU=6

[TASK3]
ENABLED=1
NAME=Keyboard Task
PRIORITY=50
TASK_PERIOD=0
START_DELAY=0

;==========================================================================
; the bus (paper, Sec. III-B, Tables 1 and 5; src/ecat/EcatMaster.h)
; SLAVENUMBER  the slaves of the bus, [AXIS0].. in the order of the bus
; CYCLE_TIME   [ns], the period of the three tasks
; SEND_DEADLINE  t_b of eq. (3) [ns] after the planned release: a send with
;              t_w + t_s > t_b counts as missed (0: one period)
; SYNC_MODE    FREE_RUN (the experiments of the paper): no distributed
;              clocks, nothing is written to the drives. SM: 0x1C32:01 = 1
;              (SM-synchronous) is written to every joint drive. DC: SYNC0
;              every cycle DC_SYNC0_SHIFT [ns] after the release, the first
;              joint drive the reference clock. With SM or DC the drives must
;              support the mode (0x1C32:04) and run in it once the bus is OP
;              (0x1C32:01); otherwise the controller ends with a warning.
;==========================================================================
[ECAT_MASTER]
SLAVENUMBER=7
CYCLE_TIME=1000000
SEND_DEADLINE=400000
SYNC_MODE=FREE_RUN
;DC_SYNC0_SHIFT=500000

; the joint drives (SLAVE_TYPE=0): CiA 402, cyclic synchronous torque
